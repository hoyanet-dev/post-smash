<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 15px; }
    button { cursor: pointer; border: 0; border-radius: 6px; padding: 8px 12px; font: inherit; }
    #smash { width: 100%; background: #ff3b30; color: #fff; font-weight: 600; }
    h2 { margin: 14px 0 6px; font-size: 12px; color: #666; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; }
    li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li button { padding: 4px 8px; background: #eee; }
    .empty { color: #999; padding: 8px 0; }
  </style>
</head>
<body>
  <h1>💥 Post Smash</h1>
  <button id="smash">Smash 모드 켜기</button>
  <h2 id="host"></h2>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
